<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anime Random</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#3316a5"/>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app-box" id="appBox">

  <h2 class="main-title">🎌 QUAL ANIME VOU ASSISTIR HOJE?</h2>

  <button id="btn">Sortear Anime</button>

  <div class="result-box" id="resultBox">

    <p id="loading">Carregando...</p>

    <div class="anime-card" id="animeCard">
      <h3 id="animeTitle"></h3>

      <p><strong>Episódios:</strong> <span id="animeEpisodes"></span></p>
      <p><strong>Duração:</strong> <span id="animeDuration"></span></p>
      <p><strong>Nota:</strong> <span id="animeScore"></span></p>
      <p><strong>Gêneros:</strong> <span id="animeGenres"></span></p>
      <p><strong>Status:</strong> <span id="animeStatus"></span></p>

      <img id="animeImage" alt="Anime" />

      <p><strong>Sinopse:</strong> <span id="animeSynopsis"></span></p>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
